<!doctype html>
<!--
  アウトロ用エンドカード（1920x1080）。
  シーンスクリプト（例: video/scenes/14-outro.mjs、後続 PR で追加）が録画中のページで
  file:// で開き、締めのナレーションの背景として表示する。デザインは title-card.html と
  統一する。外部リソースは使用しない。バージョン表記は ?version=x.y.z で差し込む。

  配色は本拡張の公開ページ（hosted/style.css）のトンマナに合わせた青グラデーション
  （--primary: #2a63d6 / --primary-dark: #1f4fb8 / --primary-light: #5b93ef）。
  ブランドバッジだけは背景と別系統で、実アイコン（tools/icons/generate_icons.py の
  PRESETS: sr-query-builder-plugin = "QB" / #54B7D1）と同じ意匠にする。
  **2 文字略号は "SR" ではなく "QB"**（SR は 3 拡張共通の接頭辞であって本拡張の記号ではない）。
  sr-data-extraction-plugin/video からの移植時の適応点（PR1 の適応点3）。
  移植元は緑（--primary: #1b5e4a）だったが、本拡張の公開ページのトンマナは青系のため
  差し替えている。

  Chrome ウェブストアの行は意図的に含めていない: 本拡張は v0.2.0 を 2026-08-07 に審査提出した
  直後で、掲載ページの URL が未確定のため（docs/store/README.md 参照）。URL が確定したら
  .links 内に Chrome Web Store の行を追記する（assemble.mjs の buildDescription() と同じ理由）。
-->
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>SR Query Builder Plugin ご案内</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI",
      "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background:
      radial-gradient(circle at 85% 15%, rgba(255, 255, 255, 0.10), transparent 45%),
      linear-gradient(135deg, #1f4fb8 0%, #2a63d6 45%, #5b93ef 100%);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 32px;
  }
  .brand-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 72px;
    height: 72px;
    border-radius: 18px;
    /* 実アイコン（tools/icons/generate_icons.py の "QB" / #54B7D1）と同じ意匠。
       角丸スクエア + 水色の縦グラデーション + 白文字。青系の背景に埋もれないよう
       白の細いリングで縁取る（アイコン本体には無いが、カード上での可読性のため） */
    background: linear-gradient(180deg, #6ac4dc 0%, #54B7D1 55%, #45a5bf 100%);
    color: #ffffff;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.9);
    font-size: 32px;
    font-weight: 700;
  }
  .brand-name {
    font-size: 44px;
    font-weight: 700;
  }
  .thanks {
    font-size: 76px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 56px;
    text-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 22px;
    font-size: 32px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.95);
  }
  .links .label {
    display: inline-block;
    min-width: 260px;
    text-align: right;
    margin-right: 24px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.75);
  }
  .credit {
    position: absolute;
    bottom: 56px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 26px;
    color: rgba(255, 255, 255, 0.7);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="brand-row">
      <span class="brand-badge">QB</span>
      <span class="brand-name">SR Query Builder Plugin</span>
    </div>
    <div class="thanks">ご視聴ありがとうございました</div>
    <div class="links">
      <div><span class="label">ヘルプページ</span>youkiti.github.io/sr-query-builder-plugin/help.html</div>
      <div><span class="label">不具合・要望</span>github.com/youkiti/sr-query-builder-plugin</div>
    </div>
    <div class="credit">ナレーション: VOICEVOX:四国めたん</div>
  </div>
</body>
</html>
