<!doctype html>
<!--
  イントロ用タイトルカード（1920x1080）。
  シーンスクリプト（例: video/scenes/01-intro.mjs、後続 PR で追加）が録画中のページで
  file:// で開き、冒頭ナレーションの背景として表示する。デザインは thumbnail.html /
  end-card.html と統一する。外部リソースは使用しない。
  バージョン表記は ?version=x.y.z で差し込む。

  配色は本拡張の公開ページ（hosted/style.css）のトンマナに合わせた青グラデーション
  （--primary: #2a63d6 / --primary-dark: #1f4fb8 / --primary-light: #5b93ef）。
  ブランドバッジだけは背景と別系統で、実アイコン（tools/icons/generate_icons.py の
  PRESETS: sr-query-builder-plugin = "QB" / #54B7D1）と同じ意匠にする。
  **2 文字略号は "SR" ではなく "QB"**（SR は 3 拡張共通の接頭辞であって本拡張の記号ではない）。
  sr-data-extraction-plugin/video からの移植時の適応点（PR1 の適応点3）。
  移植元は緑（--primary: #1b5e4a）だったが、本拡張の公開ページのトンマナは青系のため
  差し替えている。
-->
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>SR Query Builder Plugin 操作解説</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI",
      "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background:
      radial-gradient(circle at 85% 15%, rgba(255, 255, 255, 0.10), transparent 45%),
      linear-gradient(135deg, #1f4fb8 0%, #2a63d6 45%, #5b93ef 100%);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .stage::after {
    content: "";
    position: absolute;
    right: -160px;
    bottom: -200px;
    width: 640px;
    height: 640px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 40px;
  }
  .brand-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 84px;
    height: 84px;
    border-radius: 20px;
    /* 実アイコン（tools/icons/generate_icons.py の "QB" / #54B7D1）と同じ意匠。
       角丸スクエア + 水色の縦グラデーション + 白文字。青系の背景に埋もれないよう
       白の細いリングで縁取る（アイコン本体には無いが、カード上での可読性のため） */
    background: linear-gradient(180deg, #6ac4dc 0%, #54B7D1 55%, #45a5bf 100%);
    color: #ffffff;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.9);
    font-size: 38px;
    font-weight: 700;
    letter-spacing: -1px;
  }
  .brand-name {
    font-size: 46px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .headline {
    font-size: 150px;
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: 4px;
    text-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
  }
  .subtext {
    margin-top: 36px;
    font-size: 40px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.92);
  }
  .footer-row {
    position: absolute;
    left: 120px;
    right: 120px;
    bottom: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer-tag {
    font-size: 30px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.85);
    background: rgba(255, 255, 255, 0.12);
    padding: 14px 28px;
    border-radius: 999px;
  }
  .footer-version {
    font-size: 28px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.7);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="brand-row">
      <span class="brand-badge">QB</span>
      <span class="brand-name">SR Query Builder Plugin</span>
    </div>
    <div class="headline">操作解説</div>
    <div class="subtext">研究プロトコルから PubMed 検索式を生成・検証するChrome拡張機能</div>
    <div class="footer-row">
      <span class="footer-tag">OSS Chrome拡張（MIT）</span>
      <span class="footer-version" id="version-tag">v0.0.0</span>
    </div>
  </div>
  <script>
    // ?version=x.y.z をバージョン表記に反映する（無ければ既定表示のまま）
    const params = new URLSearchParams(location.search);
    const version = params.get('version');
    if (version) {
      document.getElementById('version-tag').textContent = 'v' + version;
    }
  </script>
</body>
</html>
